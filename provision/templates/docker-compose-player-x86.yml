services:
  anthias-server:
    image: $ANTHIAS_REGISTRY-server:$ANTHIAS_TAG_SUFFIX
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "80:8080"
    environment:
      - LISTEN=0.0.0.0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HOST_USER=$PI_USER
      - HOME=/data
      - WATCHTOWER_TOKEN=$WATCHTOWER_TOKEN
      - MAC_ADDRESS=$MAC_ADDRESS
    volumes:
      - resin-data:/data
      - /home/$PI_USER/.anthias:/data/.anthias
      - /home/$PI_USER/anthias_assets:/data/anthias_assets
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # Per-device identification chip data (location/group/name shown on
      # the splash-page) — a host bind mount rather than something pushed
      # into the container's writable layer, so it survives a container
      # recreate (image update, Watchtower auto-update). The host file is
      # guaranteed to exist before this is ever mounted (see
      # players/provision.py's _touch_device_label_placeholder) — an
      # absent host file would make Docker mount an empty directory here
      # instead, breaking the endpoint the splash-page's JS reads.
      - /home/$PI_USER/.anthias/mupitech-device-label.json:/usr/src/app/staticfiles/mupitech-device-label.json:ro
    depends_on:
      - redis
    # IR remote-control (MupiTech addition) needs /dev/lirc0 passed
    # through — NOT declared here by default: unlike a volume bind
    # mount, Docker's `devices:` hard-fails `up` if the host path
    # doesn't exist, and most boxes have no IR receiver at all. Add
    #   devices:
    #     - /dev/lirc0:/dev/lirc0
    # to anthias-server manually on hosts that actually have one.

  anthias-viewer:
    image: $ANTHIAS_REGISTRY-viewer:$ANTHIAS_TAG_SUFFIX
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    privileged: true
    # cage (x86's Wayland kiosk compositor) doesn't always release the
    # DRM master on SIGTERM — same rationale as upstream's own
    # docker-compose.yml.tmpl for this service.
    stop_grace_period: 3s
    stop_signal: SIGKILL
    shm_size: '2460166144'
    environment:
      - NOREFRESH=1
      - LISTEN=anthias-server
      - HOME=/data
      - PORT=8080
    volumes:
      - resin-data:/data
      - /home/$PI_USER/.asoundrc:/data/.asoundrc
      - /home/$PI_USER/.anthias:/data/.anthias
      - /home/$PI_USER/anthias_assets:/data/anthias_assets
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # No media_player.py bind mount here on purpose (there used to be
      # one, meant as a per-device audio/HDMI override point) — audio
      # output is already configurable per device via the Settings UI
      # (audio_output, read by _select_pulse_sink in the real
      # anthias_viewer/media_player.py), and the file that was actually
      # being mounted here was either empty or a stale ~145-line
      # VLC-based copy from the old third-party fork, silently replacing
      # the real ~950-line current file and breaking the viewer outright
      # (ImportError: cannot import name 'MediaPlayerProxy'). See
      # players/provision.py's needs_media_player_override.
    depends_on:
      - anthias-server
      - redis

  anthias-celery:
    # Runs on the same image as anthias-server with a CMD override —
    # matches upstream's own current shape (server and celery share one
    # image; there is no separate anthias-celery image to pull).
    image: $ANTHIAS_REGISTRY-server:$ANTHIAS_TAG_SUFFIX
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command: >
      celery -A anthias_server.celery_tasks.celery worker -B -n worker@anthias
      --loglevel=info --scheduler celery.beat.Scheduler
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HOME=/data
    volumes:
      - resin-data:/data
      - /home/$PI_USER/.anthias:/data/.anthias
      - /home/$PI_USER/anthias_assets:/data/anthias_assets
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - anthias-server
      - redis

  redis:
    image: $ANTHIAS_REGISTRY-redis:$ANTHIAS_TAG_SUFFIX
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/var/lib/redis

  host-agent:
    # Runs anthias_host_agent (same module the upstream ansible installer
    # runs as a bare host systemd service) from the already-pulled server
    # image instead — this provision.py flow has no host-side install
    # step, so without this nothing ever answers the hostcmd Redis
    # channel anthias-server publishes to: the splash page's network
    # detection spins forever (only host_agent.set_ip_addresses ever
    # writes the ip_addresses key it polls), and host:total_mem_kb /
    # host:board_subtype (used to size the low-RAM/board-specific
    # matrix) never get populated either. network_mode: host is what
    # lets it see the real host interfaces (netifaces) rather than this
    # container's own private bridge network; it reaches redis over the
    # SAME 127.0.0.1:6379 already published to the host loopback above.
    #
    # KNOWN LIMITATION: host_agent's reboot/shutdown hostcmds (also used
    # by the Fleet Manager's own Reboot/Shutdown buttons) still won't
    # work from in here — the image has no systemctl binary, and
    # reaching the host's real one would need a privileged container
    # with host PID namespace access, which isn't wired up yet. Only
    # set_ip_addresses (and the two host:* diagnostics above) work
    # today.
    image: $ANTHIAS_REGISTRY-server:$ANTHIAS_TAG_SUFFIX
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    network_mode: host
    command: python3 -m anthias_host_agent
    depends_on:
      - redis

  watchtower:
    image: containrrr/watchtower:latest
    restart: always
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_ROLLING_RESTART=true
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_HTTP_API_TOKEN=$WATCHTOWER_TOKEN
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  resin-data:
  redis-data:

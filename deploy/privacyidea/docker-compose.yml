name: mupitech-privacyidea

# Standalone privacyIDEA deployment for the Fleet Manager's optional
# third MFA provider (see mfa/privacyidea.py) — deliberately NOT part
# of the main docker-compose.yml stack: this runs on its own server,
# reachable from wherever the Fleet Manager is deployed.
#
# The exact env vars the privacyidea/privacyidea image reads have
# shifted across releases — treat the values below as a starting point
# and cross-check them against that image's own README/docs for
# whichever tag you actually deploy, especially PI_* names. This file
# was written without a live privacyIDEA instance to verify against.
#
# First-run setup (once the stack is up):
#   docker compose -p mupitech-privacyidea exec privacyidea \
#     pi-manage admin add <PI_ADMIN_USER value> -e <admin email>
#   docker compose -p mupitech-privacyidea exec privacyidea \
#     pi-manage realm create <realm> <resolver>
# — an admin account and at least one realm are both required before
# the Fleet Manager's PRIVACYIDEA_ADMIN_USER/PRIVACYIDEA_REALM settings
# will actually work.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: privacyidea
      POSTGRES_USER: privacyidea
      POSTGRES_PASSWORD: ${DB_PASSWORD:-privacyidea_secret}
    volumes:
      - privacyidea_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privacyidea"]
      interval: 5s
      timeout: 5s
      retries: 5

  privacyidea:
    image: privacyidea/privacyidea:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PI_SECRET: ${PI_SECRET:?set a random 24+ char secret — used to sign sessions}
      PI_PEPPER: ${PI_PEPPER:?set a random 24+ char pepper — used to hash admin passwords}
      PI_DB_VENDOR: postgresql
      PI_DB_HOST: db
      PI_DB_NAME: privacyidea
      PI_DB_USER: privacyidea
      PI_DB_PASSWORD: ${DB_PASSWORD:-privacyidea_secret}
      # Consumed by the image's own first-boot init script to create an
      # initial admin — see the "First-run setup" note above if your
      # image tag doesn't support this and the admin needs creating
      # manually instead.
      PI_ADMIN_USER: ${PI_ADMIN_USER:-admin}
      PI_ADMIN_PASSWORD: ${PI_ADMIN_PASSWORD:?set the initial admin password}
      PI_ADMIN_EMAIL: ${PI_ADMIN_EMAIL:-admin@example.com}
    ports:
      - "${PRIVACYIDEA_PORT:-8080}:80"
    volumes:
      - privacyidea_data:/etc/privacyidea

volumes:
  privacyidea_db:
  privacyidea_data:

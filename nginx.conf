map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Re-resolve DNS every 5s so nginx picks up new container IPs after recreate
    resolver 127.0.0.11 valid=5s;
    set $backend http://web:8000;

    # The frontend build (webpack.common.js) emits static filenames —
    # js/fleet-manager.js, css/fleet-manager.css — not the usual
    # content-hashed ones (js/fleet-manager.abcd1234.js), so a deploy
    # changes the file's *content* but never its *URL*. Under the
    # general /static/ block's 30d expires below, every browser that
    # already loaded the page keeps serving its cached copy for up to
    # 30 days after a deploy, silently masking every frontend fix
    # shipped in the meantime (not just this one) unless someone
    # happens to hard-refresh. no-cache (not no-store) still lets
    # nginx answer with a cheap 304 when the file genuinely hasn't
    # changed, via the ETag/Last-Modified it already sends by default —
    # this only forces the revalidation round-trip, not a full
    # re-download on every load.
    location /static/js/ {
        alias /app/staticfiles/js/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location /static/css/ {
        alias /app/staticfiles/css/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/cctv/ {
        alias /app/media/cctv/;
        add_header Cache-Control no-cache;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            image/jpeg jpg;
        }
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;

        # Efficient file serving
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Shared by both server blocks below. Kept inline (not an `include`d file)
# because update-nginx-conf.py only ever syncs this one file's content into
# the running nginx container — a separate included file would silently go
# stale there until the next full `docker compose up --build`.
server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Re-resolve DNS every 5s so nginx picks up new container IPs after recreate
    resolver 127.0.0.11 valid=5s;
    set $backend http://web:8000;

    # The frontend build (webpack.common.js) emits static filenames —
    # js/fleet-manager.js, css/fleet-manager.css — not the usual
    # content-hashed ones (js/fleet-manager.abcd1234.js), so a deploy
    # changes the file's *content* but never its *URL*. Under the
    # general /static/ block's 30d expires below, every browser that
    # already loaded the page keeps serving its cached copy for up to
    # 30 days after a deploy, silently masking every frontend fix
    # shipped in the meantime (not just this one) unless someone
    # happens to hard-refresh. no-cache (not no-store) still lets
    # nginx answer with a cheap 304 when the file genuinely hasn't
    # changed, via the ETag/Last-Modified it already sends by default —
    # this only forces the revalidation round-trip, not a full
    # re-download on every load.
    location /static/js/ {
        alias /app/staticfiles/js/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location /static/css/ {
        alias /app/staticfiles/css/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/cctv/ {
        alias /app/media/cctv/;
        add_header Cache-Control no-cache;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            image/jpeg jpg;
        }
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;

        # Efficient file serving
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Device image operations (migrate/rebuild/restore) stay on one
    # synchronous request for their whole SSH session — connect, docker
    # pull + up, and (migrate/rebuild) a device reboot plus up to 180s
    # polling for it to come back (players/migrate_image.py::
    # wait_for_player_ready) — routinely past the general 120s timeout
    # below, which was silently killing the request and surfacing as a
    # failure to the operator even when the migration itself went on to
    # finish successfully server-side. The frontend already narrates
    # progress during the wait (player-detail.tsx::handleMigrateImage) —
    # this is the other half, giving the request itself room to finish.
    location ~ ^/api/players/[^/]+/(migrate-image|rebuild-image|restore-image)/$ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# HTTPS, autoassinado (gerado por nginx-entrypoint.sh em /etc/nginx/ssl/ na
# primeira vez que o container arranca — ver esse script para o porquê de
# não ser gerado aqui no build). Puramente aditivo: existe só para que o
# browser tenha um https:// real para o bounce do login Microsoft 365
# (fleet_manager/m365_backend.py) — o bloco 80 acima continua sem alterações
# para os devices, que falam com esta Fleet Manager em HTTP simples.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    client_max_body_size 500M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 valid=5s;
    set $backend http://web:8000;

    location /static/js/ {
        alias /app/staticfiles/js/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location /static/css/ {
        alias /app/staticfiles/css/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/cctv/ {
        alias /app/media/cctv/;
        add_header Cache-Control no-cache;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            image/jpeg jpg;
        }
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location ~ ^/api/players/[^/]+/(migrate-image|rebuild-image|restore-image)/$ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 110" width="340" height="110" role="img" aria-label="MupiTech — Gestor de Mupis Digitais">
  <title>MupiTech — Gestor de Mupis Digitais</title>
  <defs>
    <linearGradient id="mupitech-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0082C8"/>
      <stop offset="1" stop-color="#0C3A5C"/>
    </linearGradient>
  </defs>
  <!-- Mark: a mupi — a tall illuminated panel on a slim post, not a TV -->
  <rect x="2" y="12" width="86" height="86" rx="20" fill="url(#mupitech-mark)"/>
  <rect x="30" y="24" width="30" height="42" rx="4" fill="#FFE72D"/>
  <rect x="43" y="66" width="4" height="9" fill="#FDED3A"/>
  <rect x="35" y="75" width="20" height="5" rx="2.5" fill="#FDED3A"/>
  <text x="104" y="55" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8">
    <tspan fill="#04182B">Mupi</tspan><tspan fill="#0082C8">Tech</tspan>
  </text>
  <text x="105" y="80" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="16.5" font-weight="600" letter-spacing="0.2" fill="#0C3A5C">Gestor de Mupis Digitais</text>
</svg>

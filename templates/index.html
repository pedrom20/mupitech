{% load static %}
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MupiTech</title>
    <meta name="description" content="MupiTech — gestão centralizada de mupis digitais."/>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}"/>
    <link rel="manifest" href="{% static 'manifest.json' %}"/>
    <link rel="apple-touch-icon" href="{% static 'img/icon-192.png' %}"/>
    <link href="{% static 'dist/css/fleet-manager.css' %}?v={{ app_version }}.{{ build_date }}" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <script>
        (function(){var t=localStorage.getItem('fm_theme');if(t==='dark')document.documentElement.setAttribute('data-bs-theme','dark')})();
    </script>
    <div id="root"></div>
    <script src="{% static 'dist/js/fleet-manager.js' %}?v={{ app_version }}.{{ build_date }}"></script>
</body>
</html>

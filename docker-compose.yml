name: mupitech-fleet-manager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet_manager
      POSTGRES_USER: fleet_manager
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fleet_manager_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/pedrom20/mupiteck:latest
    restart: unless-stopped
    environment: &app-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      DUO_IKEY: ${DUO_IKEY:-}
      DUO_SKEY: ${DUO_SKEY:-}
      DUO_HOST: ${DUO_HOST:-}
      PRIVACYIDEA_URL: ${PRIVACYIDEA_URL:-}
      PRIVACYIDEA_ADMIN_USER: ${PRIVACYIDEA_ADMIN_USER:-}
      PRIVACYIDEA_ADMIN_PASSWORD: ${PRIVACYIDEA_ADMIN_PASSWORD:-}
      PRIVACYIDEA_REALM: ${PRIVACYIDEA_REALM:-}
      PRIVACYIDEA_RESOLVER: ${PRIVACYIDEA_RESOLVER:-}
      PRIVACYIDEA_VERIFY_SSL: ${PRIVACYIDEA_VERIFY_SSL:-true}
      AUTH_LDAP_SERVER_URI: ${AUTH_LDAP_SERVER_URI:-}
      AUTH_LDAP_BIND_DN: ${AUTH_LDAP_BIND_DN:-}
      AUTH_LDAP_BIND_PASSWORD: ${AUTH_LDAP_BIND_PASSWORD:-}
      AUTH_LDAP_USER_SEARCH_BASE: ${AUTH_LDAP_USER_SEARCH_BASE:-}
      AUTH_LDAP_USER_SEARCH_FILTER: ${AUTH_LDAP_USER_SEARCH_FILTER:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: fleet_manager
      DB_USER: fleet_manager
      DB_PASSWORD: ${DB_PASSWORD:-fleet_manager_secret}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:9000}
      PLAYER_REGISTER_TOKEN: ${PLAYER_REGISTER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - deploy_files:/app/deploy_files
      - media_files:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      - /usr/bin/tailscale:/usr/bin/tailscale:ro
      - /etc/hostname:/etc/host_hostname:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-9000}:80"
    volumes:
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - web

  celery-worker:
    image: ghcr.io/pedrom20/mupiteck:latest
    restart: unless-stopped
    command: celery -A fleet_manager worker -l info --concurrency=4 -Q celery
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - deploy_files:/app/deploy_files
      - media_files:/app/media
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  celery-transcode:
    image: ghcr.io/pedrom20/mupiteck:latest
    restart: unless-stopped
    command: celery -A fleet_manager worker -l info --concurrency=1 -Q transcode
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - deploy_files:/app/deploy_files
      - media_files:/app/media
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  celery-beat:
    image: ghcr.io/pedrom20/mupiteck:latest
    restart: unless-stopped
    command: celery -A fleet_manager beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    profiles:
      - tunnel

  updater:
    image: docker:27-cli
    restart: unless-stopped
    entrypoint: ["sh", "-c", "trap 'exit 0' TERM INT; while sleep 86400 & wait; do :; done"]
    # No COMPOSE_PROJECT_NAME here on purpose: it can't be trusted to
    # match the project this stack actually deployed under (a hardcoded
    # "mupitech-fleet-manager" doesn't match a Portainer stack literally
    # named "mupitech", for one) — fleet_manager/system_views.py reads
    # the *real* one off this container's own com.docker.compose.project
    # label at update time instead.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro

  # Local mirror of the MupiTech player images (server/viewer/redis, per
  # architecture) — lets devices on a LAN with slow/no internet pull from
  # here instead of GHCR. Opt-in: only starts with `--profile registry`,
  # and only useful once enabled + synced from Settings > Registry Mirror.
  # Plain HTTP (no TLS) — devices need `insecure-registries` set for this
  # host, which the Fleet Manager configures automatically during
  # provisioning when the mirror is enabled.
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5050}:5000"
    volumes:
      - registry_data:/var/lib/registry
    profiles:
      - registry

volumes:
  postgres_data:
  static_files:
  deploy_files:
  media_files:
  registry_data:

services:
  anthias-server:
    image: $ANTHIAS_REGISTRY-server:$ANTHIAS_TAG_SUFFIX
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "80:8080"
    environment:
      - LISTEN=0.0.0.0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HOST_USER=$PI_USER
      - HOME=/data
      - WATCHTOWER_TOKEN=$WATCHTOWER_TOKEN
      - MAC_ADDRESS=$MAC_ADDRESS
    volumes:
      - resin-data:/data
      - /home/$PI_USER/.anthias:/data/.anthias
      - /home/$PI_USER/anthias_assets:/data/anthias_assets
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # Per-device identification chip data (location/group/name shown on
      # the splash-page) — a host bind mount rather than something pushed
      # into the container's writable layer, so it survives a container
      # recreate (image update, Watchtower auto-update). The host file is
      # guaranteed to exist before this is ever mounted (see
      # players/provision.py's _touch_device_label_placeholder) — an
      # absent host file would make Docker mount an empty directory here
      # instead, breaking the endpoint the splash-page's JS reads.
      - /home/$PI_USER/.anthias/mupitech-device-label.json:/usr/src/app/staticfiles/mupitech-device-label.json:ro
    depends_on:
      - redis
    # CEC/IR passthrough (MupiTech addition) — NOT declared here by
    # default: unlike a volume bind mount, Docker's `devices:` hard-fails
    # `up` if the host path doesn't exist, and CEC-on-Pi4 hasn't been
    # confirmed across our fleet's HDMI wiring yet. Add on hosts that
    # have it — and add the SAME block to anthias-celery below too:
    # the periodic display_power probe runs there (celery-beat), not
    # here, so CEC/IR only being added to this service leaves the
    # status poller permanently reporting "No CEC adapter" (confirmed
    # live on a real Pi 4 — /dev/cec0 present on the host, container
    # detects the adapter fine once passed through, but the status
    # shown in the Fleet Manager never updates until anthias-celery
    # gets the same device(s) too).
    #   devices:
    #     - /dev/cec0:/dev/cec0
    #     - /dev/lirc0:/dev/lirc0

  anthias-viewer:
    image: $ANTHIAS_REGISTRY-viewer:$ANTHIAS_TAG_SUFFIX
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    privileged: true
    # Pi 4 renders through Qt's eglfs_kms platform (no compositor, direct
    # DRM/KMS) rather than cage — but a slow/hung shutdown path on
    # SIGTERM is a risk on any board holding DRM master directly, so this
    # keeps the same conservative stop behavior as the Wayland boards.
    stop_grace_period: 3s
    stop_signal: SIGKILL
    shm_size: '2460166144'
    environment:
      - NOREFRESH=1
      - LISTEN=anthias-server
      - HOME=/data
      - PORT=8080
    volumes:
      - resin-data:/data
      - /home/$PI_USER/.asoundrc:/data/.asoundrc
      - /home/$PI_USER/.anthias:/data/.anthias
      - /home/$PI_USER/anthias_assets:/data/anthias_assets
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # No media_player.py bind mount here on purpose — see the same
      # note in docker-compose-player-x86.yml (players/provision.py's
      # needs_media_player_override).
    depends_on:
      - anthias-server
      - redis

  anthias-celery:
    # Runs on the same image as anthias-server with a CMD override —
    # matches upstream's own current shape (server and celery share one
    # image; there is no separate anthias-celery image to pull).
    image: $ANTHIAS_REGISTRY-server:$ANTHIAS_TAG_SUFFIX
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command: >
      celery -A anthias_server.celery_tasks.celery worker -B -n worker@anthias
      --loglevel=info --scheduler celery.beat.Scheduler
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HOME=/data
    volumes:
      - resin-data:/data
      - /home/$PI_USER/.anthias:/data/.anthias
      - /home/$PI_USER/anthias_assets:/data/anthias_assets
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # CEC/IR passthrough (MupiTech addition) — see the matching comment
    # on anthias-server above. This service is where the periodic
    # display_power probe actually runs (celery-beat), so it needs the
    # SAME devices: block, not just anthias-server:
    #   devices:
    #     - /dev/cec0:/dev/cec0
    #     - /dev/lirc0:/dev/lirc0
    depends_on:
      - anthias-server
      - redis

  redis:
    image: $ANTHIAS_REGISTRY-redis:$ANTHIAS_TAG_SUFFIX
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/var/lib/redis

  watchtower:
    image: containrrr/watchtower:latest
    restart: always
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_ROLLING_RESTART=true
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_HTTP_API_TOKEN=$WATCHTOWER_TOKEN
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  resin-data:
  redis-data:

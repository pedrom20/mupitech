name: Build and Push to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=sha,prefix=

      - name: Set build date
        id: build_date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.build_date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The in-app update checker (fleet_manager/system_views.py) reads
      # GitHub Releases/tags to find out if a newer version exists — with
      # neither ever published, it always reported "nothing to compare
      # against". Publish one release per version bump so it has
      # something real to check. Guarded to branch pushes only (not tag
      # pushes) so creating the tag here can't retrigger this workflow.
      - name: Extract version from changelog.ts
        id: version
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" static/src/changelog.ts || echo "")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release for this version
        if: github.ref == 'refs/heads/main' && steps.version.outputs.value != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
